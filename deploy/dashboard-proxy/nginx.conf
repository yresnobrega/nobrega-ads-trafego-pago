server {
    listen 80;
    server_name _;

    # Encaminha tudo pro dashboard_server.py que já roda na própria VPS
    # (systemd, porta 8888) — este container só existe pra dar domínio +
    # HTTPS automático via Traefik/Let's Encrypt do Easypanel.
    location / {
        proxy_pass http://108.174.145.85:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }
}
